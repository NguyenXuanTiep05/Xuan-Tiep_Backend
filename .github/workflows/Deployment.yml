name: Deployment
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Restore dependencies
        run: dotnet restore
      - name: Build
        run: dotnet build --no-restore
      - name: Test
        run: dotnet test --no-build --verbosity normal
  deploy:
    needs: build
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Publish
        run: dotnet publish -c Release -o ./publish
      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
      - name: Decode SSH key
        run: |
          printf '%s' "${{ secrets.SERVER_SSH_KEY }}" | base64 -d -i > deploy_key
          chmod 600 deploy_key
      - name: Copy files to server
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_TAILSCALE_IP }} \
            "mkdir -p /var/www/Auth/publish"
          scp -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i deploy_key -r \
            ./publish/* \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_TAILSCALE_IP }}:/var/www/Auth/publish/
      - name: Restart service
        run: |
          ssh -o StrictHostKeyChecking=no -o ConnectTimeout=15 -i deploy_key \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_TAILSCALE_IP }} \
            "sudo systemctl restart auth && sudo systemctl status auth --no-pager"
